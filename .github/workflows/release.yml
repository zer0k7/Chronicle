name: Chronicle Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Extract Tag Version
        id: tag_version
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p /tmp/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore/release.keystore

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: /tmp/keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename and Prepare Release Artifact
        run: |
          VERSION="${{ steps.tag_version.outputs.TAG_NAME }}"
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/app-release.apk release_artifacts/chronicle-v${VERSION}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/chronicle-v${{ steps.tag_version.outputs.TAG_NAME }}.apk
          name: "Chronicle v${{ steps.tag_version.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          generate_release_notes: true
