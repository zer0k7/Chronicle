name: Chronicle Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Extract Tag Version and Custom Release Notes
        id: tag_info
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "TAG_NAME=${TAG_VERSION}" >> $GITHUB_OUTPUT
          
          # Extract annotated tag message
          NOTES=$(git tag -l --format='%(contents)' "$TAG_NAME")
          if [ -n "$NOTES" ]; then
            echo "HAS_NOTES=true" >> $GITHUB_OUTPUT
            printf "%s\n" "$NOTES" > /tmp/release_notes.md
          else
            echo "HAS_NOTES=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set. Cannot build a signed release."
            echo "Please add the base64-encoded keystore as a GitHub secret named KEYSTORE_BASE64."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/chronicle-release.jks
          echo "KEYSTORE_PATH=/tmp/chronicle-release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease

      - name: Rename and Prepare Release Artifact
        run: |
          VERSION="${{ steps.tag_info.outputs.TAG_NAME }}"
          mkdir -p release_artifacts
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release_artifacts/chronicle-v${VERSION}.apk \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/chronicle-v${{ steps.tag_info.outputs.TAG_NAME }}.apk
          name: "Chronicle v${{ steps.tag_info.outputs.TAG_NAME }}"
          body_path: ${{ steps.tag_info.outputs.HAS_NOTES == 'true' && '/tmp/release_notes.md' || '' }}
          draft: false
          prerelease: false
          generate_release_notes: ${{ steps.tag_info.outputs.HAS_NOTES != 'true' }}
