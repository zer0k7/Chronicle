name: Chronicle Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Extract Tag Version
        id: tag_version
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p /tmp/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding provided release keystore secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/keystore/release.keystore
            echo "KEYSTORE_PATH=/tmp/keystore/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "Generating automated release signing keystore..."
            keytool -genkeypair -v \
              -keystore /tmp/keystore/release.keystore \
              -alias chronicle_release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass chroniclepass123 \
              -keypass chroniclepass123 \
              -dname "CN=Chronicle, OU=Android, O=Chronicle, L=Global, S=Global, C=IN"
            echo "KEYSTORE_PATH=/tmp/keystore/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=chroniclepass123" >> $GITHUB_ENV
            echo "KEY_ALIAS=chronicle_release" >> $GITHUB_ENV
            echo "KEY_PASSWORD=chroniclepass123" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease

      - name: Rename and Prepare Release Artifact
        run: |
          VERSION="${{ steps.tag_version.outputs.TAG_NAME }}"
          mkdir -p release_artifacts
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release_artifacts/chronicle-v${VERSION}.apk \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/chronicle-v${{ steps.tag_version.outputs.TAG_NAME }}.apk
          name: "Chronicle v${{ steps.tag_version.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          generate_release_notes: true
